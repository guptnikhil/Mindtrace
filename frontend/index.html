<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindTrace — Student Wellbeing Companion</title>
    <meta name="description" content="MindTrace: Early-warning student wellbeing companion & routine drift analysis system for engineering students." />
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('wellbeing_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fafaf8] text-[#1f2d2a] dark:bg-[#121e1b] dark:text-[#e2ece8]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
