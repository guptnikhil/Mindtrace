services:
  # Backend Web Service (FastAPI)
  - type: web
    name: mindtrace-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: 'https://mindtrace-app-rho.vercel.app,http://localhost:5173'
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site (Vite React)
  - type: web
    name: mindtrace-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mindtrace-backend
          property: host
        value: https://${host}/api
